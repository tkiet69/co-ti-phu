<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cờ Tỉ Phú Việt Nam 3D</title>
<style>
  :root { --red:#c62828; --gold:#f9c74f; --ink:#1d1d1f; --panel:rgba(255,255,255,.94); }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#16241b; color:var(--ink);
    font-family: "Segoe UI", Roboto, Arial, sans-serif; }
  #scene { position:fixed; inset:0; }
  #scene canvas { display:block; }

  #players { position:fixed; top:12px; left:12px; width:230px; display:flex; flex-direction:column; gap:8px; z-index:5; }
  .pcard { background:var(--panel); border-radius:10px; padding:8px 10px; border-left:6px solid; box-shadow:0 2px 8px rgba(0,0,0,.25); transition:transform .2s; }
  .pcard { position:relative; }
  .pcard.active { outline:3px solid var(--gold); transform:translateX(4px); }
  .turnArrow { position:absolute; right:-40px; top:50%; transform:translateY(-50%); font-size:30px; line-height:1; color:#ffd54f;
    text-shadow:0 0 6px rgba(0,0,0,.6), 0 0 14px rgba(255,213,79,.9); animation:arrowBlink .8s ease-in-out infinite; pointer-events:none; }
  @keyframes arrowBlink { 0%,100% { opacity:1; transform:translate(0,-50%); } 50% { opacity:.15; transform:translate(8px,-50%); } }
  .orderRoll { margin-left:auto; background:#263238; color:#fff; border-radius:6px; padding:1px 6px; font-size:13px; white-space:nowrap; flex:none; }
  .pcard.out { opacity:.45; filter:grayscale(1); }
  .pname { font-weight:700; display:flex; align-items:center; gap:6px; }
  .dot { width:12px; height:12px; border-radius:50%; display:inline-block; flex:none; }
  .pmoney { font-size:20px; font-weight:800; color:#1b5e20; }
  .pinfo { font-size:12px; color:#555; }
  .passetM { display:none; }

  #side { position:fixed; top:12px; right:12px; width:310px; max-height:calc(100vh - 24px); display:flex; flex-direction:column; gap:8px; z-index:5; }
  .panel { background:var(--panel); border-radius:10px; padding:10px; box-shadow:0 2px 8px rgba(0,0,0,.25); }
  .turn { margin-bottom:8px; }
  .muted { color:#666; font-size:13px; }
  .btns { display:flex; flex-wrap:wrap; gap:6px; }
  .btn { border:none; border-radius:8px; padding:9px 13px; font-weight:700; font-size:14px; cursor:pointer; background:var(--red); color:#fff; font-family:inherit; }
  .btn.alt { background:#455a64; }
  .btn.ok { background:#2e7d32; }
  .btn.sm { padding:4px 8px; font-size:12px; border-radius:6px; }
  .btn:disabled { opacity:.35; cursor:not-allowed; }
  #manage { overflow:auto; max-height:34vh; }
  #manage h4 { margin:0 0 6px; font-size:14px; }
  .prow { display:flex; align-items:center; gap:6px; padding:4px 0; border-top:1px solid #eee; font-size:13px; flex-wrap:wrap; }
  .prow .nm { flex:1; min-width:110px; display:flex; align-items:center; gap:5px; }
  .chip { width:10px; height:16px; border-radius:2px; flex:none; }
  #logPanel { padding:6px 10px 8px; }
  #logPanel.hidden { display:none; }
  .logHead { display:flex; align-items:center; justify-content:space-between; font-size:13px; color:#555; margin-bottom:2px; }
  .iconbtn { border:none; background:#eceff1; border-radius:6px; width:26px; height:24px; cursor:pointer; font-size:13px; margin-left:4px; color:#37474f; }
  .iconbtn:hover { background:#cfd8dc; }
  #log { overflow:auto; max-height:46px; font-size:13px; line-height:1.45; transition:max-height .3s ease; }
  #logPanel.expanded #log { max-height:40vh; }
  #logShow { display:none; align-self:flex-end; }
  #logShow.show { display:inline-block; }
  #log div { padding:2px 0; border-bottom:1px dashed #e5e5e5; }
  #log .sep { color:#999; font-weight:600; }

  #modal { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:20; padding:16px; }
  #modal.show { display:flex; }
  #modalBox { background:#fff; border-radius:14px; padding:20px; width:100%; max-width:380px; max-height:92vh; overflow:auto; box-shadow:0 10px 40px rgba(0,0,0,.4); }
  #modalBox h2 { margin:0 0 6px; }
  .mbtns { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; flex-wrap:wrap; }
  .setupRow { display:flex; gap:6px; align-items:center; margin:6px 0; }
  .setupRow input[type=text] { flex:1; min-width:0; padding:7px; border:1px solid #ccc; border-radius:6px; font-family:inherit; }
  .setupRow select { padding:7px; border-radius:6px; border:1px solid #ccc; font-family:inherit; }
  #modalBox.wide { max-width:470px; }
  .setupP { border:1px solid #e0e0e0; border-radius:10px; padding:4px 8px 8px; margin:8px 0; border-left:6px solid var(--pc); }
  .setupP.off { opacity:.45; }
  .setupP .setupRow { margin:4px 0; }
  .sub { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding-left:24px; }
  .sub select { padding:5px; border-radius:6px; border:1px solid #ccc; font-family:inherit; font-size:13px; }
  .swatches { display:flex; gap:4px; flex-wrap:wrap; }
  .sw { width:20px; height:20px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1px #bbb; cursor:pointer; padding:0; position:relative; }
  .sw.sel { box-shadow:0 0 0 2px #212121; transform:scale(1.15); }
  .sw:disabled { cursor:not-allowed; opacity:.35; }
  .sw:disabled::after { content:'✕'; position:absolute; inset:0; color:#fff; font-size:12px; line-height:16px; font-weight:900; }

  .deed { border:2px solid #222; border-radius:6px; overflow:hidden; font-size:14px; background:#fffdf5; }
  .deedHead { text-align:center; padding:8px; font-weight:800; font-size:18px; }
  .deedHead small { display:block; font-size:10px; font-weight:600; letter-spacing:1px; opacity:.85; }
  .deed table { width:100%; border-collapse:collapse; }
  .deed td { padding:3px 10px; }
  .deed td:last-child { text-align:right; font-weight:600; }
  .deedFoot { border-top:1px solid #ccc; padding:6px 10px; font-size:13px; }
  .card { border-radius:10px; padding:18px; text-align:center; font-size:17px; font-weight:600; color:#fff; }
  .card .ct { font-size:13px; letter-spacing:2px; opacity:.9; margin-bottom:8px; }

  /* Chế độ 2 vs 2 */
  .tbadge { display:inline-block; font-size:11px; font-weight:800; padding:1px 7px; border-radius:6px; color:#fff; vertical-align:middle; }
  .tbadge.A { background:#d84315; } .tbadge.B { background:#283593; }
  .teambar { display:flex; gap:6px; }
  .pcard.tbox { flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:flex-start; gap:2px; padding:6px 10px; white-space:nowrap; }
  .pcard.tbox b { font-size:17px; }
  .pcard.tbox.A { border-left:6px solid #d84315; }
  .pcard.tbox.B { border-left:6px solid #283593; }
  .modeSel { display:flex; gap:8px; margin:8px 0; flex-wrap:wrap; }
  .modeSel label { flex:1; min-width:140px; border:2px solid #ddd; border-radius:10px; padding:8px 10px; cursor:pointer; font-weight:700; font-size:14px; }
  .modeSel label:has(input:checked) { border-color:#c62828; background:#fff5f5; }

  /* Nút lớn giữa màn hình: tung xúc xắc / kết thúc lượt */
  #bigAction { position:fixed; left:50%; top:16px; transform:translateX(-50%); z-index:8; }
  .bigbtn { display:flex; flex-direction:column; align-items:center; gap:2px; border:none; cursor:pointer; font-family:inherit;
    font-size:24px; font-weight:900; letter-spacing:1px; color:#fff; padding:18px 38px; border-radius:999px; min-width:300px; justify-content:center;
    border:4px solid rgba(255,255,255,.9); box-shadow:0 8px 0 rgba(0,0,0,.25), 0 14px 30px rgba(0,0,0,.35);
    transition:transform .12s, box-shadow .12s, opacity .2s; position:relative; animation:bigIn .35s cubic-bezier(.2,.9,.3,1.3); }
  .bigbtn .bi { font-size:32px; line-height:1; }
  .bigbtn .row { display:flex; align-items:center; gap:12px; white-space:nowrap; }
  .bigbtn small { display:block; text-align:center; font-size:11px; font-weight:700; opacity:.8; letter-spacing:1px; }
  .bigbtn.roll { background:linear-gradient(180deg,#ef5350,#c62828); }
  .bigbtn.roll:not(:disabled) { animation:bigIn .35s cubic-bezier(.2,.9,.3,1.3), bigPulse 1.4s ease-in-out .35s infinite; }
  .bigbtn.end { background:linear-gradient(180deg,#43a047,#1b5e20); }
  .bigbtn:hover:not(:disabled) { transform:translateY(-3px) scale(1.03); }
  .bigbtn:active:not(:disabled) { transform:translateY(4px); box-shadow:0 3px 0 rgba(0,0,0,.25), 0 6px 14px rgba(0,0,0,.3); }
  .bigbtn:disabled { opacity:.45; cursor:not-allowed; animation:none; }
  @keyframes bigIn { from { transform:scale(.6); opacity:0; } to { transform:none; opacity:1; } }
  @keyframes bigPulse { 0%,100% { box-shadow:0 8px 0 rgba(0,0,0,.25), 0 14px 30px rgba(0,0,0,.35), 0 0 0 0 rgba(255,82,82,.6); }
    50% { box-shadow:0 8px 0 rgba(0,0,0,.25), 0 14px 30px rgba(0,0,0,.35), 0 0 0 16px rgba(255,82,82,0); } }
  @media (max-width: 760px) {
    .bigbtn { font-size:20px; padding:14px 26px; min-width:240px; }
    .bigbtn .bi { font-size:26px; }
  }

  /* Lá bài Cơ hội / Khí vận */
  #cardOverlay { position:fixed; inset:0; z-index:18; display:none; flex-direction:column; align-items:center; justify-content:center; gap:16px; background:rgba(10,15,30,.5); overflow:hidden; }
  #cardOverlay.show { display:flex; }
  .cwho { color:#fff; font-weight:700; font-size:16px; text-shadow:0 1px 3px #000; }
  .flip-wrap { perspective:1100px; cursor:pointer; animation:dealIn .6s cubic-bezier(.2,.9,.3,1.15) both; }
  .flip-wrap.idle .flipcard { animation:wobble 1.6s ease-in-out .6s infinite; }
  .flip-wrap.idle:hover .flipcard { animation-play-state:paused; transform:translateY(-10px) scale(1.04); }
  .flipcard { width:240px; height:340px; position:relative; transform-style:preserve-3d; transition:transform .85s cubic-bezier(.3,1.35,.5,1); }
  .flipcard.flipped { transform:rotateY(180deg) scale(1.08); }
  .face { position:absolute; inset:0; border-radius:16px; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    box-shadow:0 14px 40px rgba(0,0,0,.5); display:flex; flex-direction:column; align-items:center; justify-content:center; overflow:hidden; }
  .face.back { color:#fff; border:6px solid #fff; }
  .face.back.chance { background:repeating-linear-gradient(45deg,#ef6c00 0 14px,#f57c00 14px 28px); }
  .face.back.chest { background:repeating-linear-gradient(45deg,#1565c0 0 14px,#1976d2 14px 28px); }
  .face.back::after { content:""; position:absolute; inset:0; background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.45) 45%,transparent 60%);
    background-size:250% 100%; animation:shine 2.2s linear infinite; }
  .bicon { font-size:96px; filter:drop-shadow(0 4px 6px rgba(0,0,0,.3)); }
  .btitle { font-size:28px; font-weight:900; letter-spacing:3px; margin-top:8px; text-shadow:0 2px 4px rgba(0,0,0,.3); }
  .face.front { transform:rotateY(180deg); background:#fffdf5; border:6px solid; justify-content:flex-start; }
  .face.front.chance { border-color:#ef6c00; } .face.front.chest { border-color:#1565c0; }
  .fhead { width:100%; padding:14px; text-align:center; color:#fff; font-weight:900; letter-spacing:2px; font-size:18px; }
  .front.chance .fhead { background:#ef6c00; } .front.chest .fhead { background:#1565c0; }
  .ftext { flex:1; display:flex; align-items:center; justify-content:center; padding:20px; text-align:center; font-size:20px; font-weight:700; color:#222; line-height:1.4; }
  .flipcard.flipped .front { animation:glow 1.2s ease-out .45s; }
  .chint { color:#fff; font-weight:700; text-shadow:0 1px 3px #000; animation:pulse .8s infinite alternate; }
  .cok { opacity:0; transform:translateY(10px); transition:all .3s; pointer-events:none; min-width:120px; }
  .cok.show { opacity:1; transform:none; pointer-events:auto; }
  .spark { position:absolute; left:50%; top:50%; font-size:24px; pointer-events:none; animation:spark .9s ease-out forwards; }
  @keyframes dealIn { from { transform:translateY(-30vh) rotateX(70deg) scale(.3); opacity:0; } to { transform:none; opacity:1; } }
  @keyframes wobble { 0%,100% { transform:rotateZ(-2deg) translateY(0); } 50% { transform:rotateZ(2deg) translateY(-8px); } }
  @keyframes shine { from { background-position:150% 0; } to { background-position:-100% 0; } }
  @keyframes glow { from { box-shadow:0 0 0 0 rgba(255,213,64,.95), 0 14px 40px rgba(0,0,0,.5); } to { box-shadow:0 0 0 34px rgba(255,213,64,0), 0 14px 40px rgba(0,0,0,.5); } }
  @keyframes pulse { to { opacity:.45; } }
  @keyframes spark { from { transform:translate(-50%,-50%) scale(.3); opacity:1; } to { transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.2) rotate(180deg); opacity:0; } }
  @media (max-width: 760px) { .flipcard { width:200px; height:290px; } .bicon { font-size:76px; } .ftext { font-size:17px; } }

  #tileInfo { position:fixed; left:12px; bottom:12px; width:250px; z-index:6; display:none; }
  #tileInfo.show { display:block; }
  #sndBox { position:fixed; left:254px; top:62px; z-index:7; display:flex; flex-direction:column; gap:8px; }
  .badge { position:absolute; top:-4px; right:-4px; min-width:18px; height:18px; padding:0 4px; border-radius:9px; background:#e53935; color:#fff;
    font-size:11px; font-weight:800; line-height:18px; text-align:center; }
  /* Khung chat */
  #chatPanel { position:fixed; left:12px; bottom:12px; width:330px; max-height:min(560px, 72vh); z-index:9; display:none; flex-direction:column; gap:6px; padding:10px; }
  #chatPanel.show { display:flex; animation:sheetUp2 .2s ease-out; }
  @keyframes sheetUp2 { from { transform:translateY(20px); opacity:0; } to { transform:none; opacity:1; } }
  .chatHead { display:flex; justify-content:space-between; align-items:center; }
  #chatLog { flex:1; min-height:90px; max-height:240px; overflow:auto; font-size:13.5px; line-height:1.45; background:#f6f7f9; border-radius:8px; padding:6px 8px; }
  .cmsg { padding:2px 0; word-wrap:break-word; }
  .cmsg.mine { background:#fff8e1; border-radius:6px; padding:2px 6px; margin:1px -4px; }
  .cmsg.sys { color:#6d4c41; font-style:italic; }
  .bigEmo { font-size:20px; vertical-align:middle; }
  .tLbl { font-size:12px; font-weight:700; color:#777; margin-bottom:3px; }
  .tTargets { display:flex; gap:5px; flex-wrap:wrap; margin-bottom:6px; }
  .tChip { border:2px solid #e0e0e0; background:#fff; border-radius:999px; padding:3px 9px 3px 6px; font-size:12.5px; font-weight:700; cursor:pointer;
    display:flex; align-items:center; gap:4px; font-family:inherit; max-width:140px; overflow:hidden; white-space:nowrap; }
  .tChip.sel { border-color:var(--pc); background:color-mix(in srgb, var(--pc) 14%, #fff); }
  .tItems { display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; }
  .tItem { border:none; border-radius:10px; background:#fff3e0; font-size:24px; padding:6px 2px 4px; cursor:pointer; display:flex; flex-direction:column; align-items:center;
    box-shadow:0 2px 0 #ffcc80; font-family:inherit; transition:transform .1s; }
  .tItem small { font-size:11px; font-weight:700; color:#6d4c41; }
  .tItem:active { transform:translateY(2px) scale(.95); box-shadow:none; }
  .emoRow { display:flex; flex-wrap:wrap; gap:2px; }
  .emo { border:none; background:none; font-size:21px; cursor:pointer; padding:2px 3px; border-radius:6px; }
  .emo:hover { background:#eceff1; transform:scale(1.15); }
  #chatForm { display:flex; gap:6px; }
  #chatIn { flex:1; min-width:0; padding:8px 10px; border:2px solid #e0e0e0; border-radius:10px; font-family:inherit; font-size:14px; }
  #chatIn:focus { outline:none; border-color:#1e88e5; }
  .roundBtn { width:42px; height:42px; border-radius:50%; border:none; cursor:pointer; background:rgba(255,255,255,.94);
    box-shadow:0 2px 8px rgba(0,0,0,.3); font-size:19px; position:relative; }
  .roundBtn.off { opacity:.55; }
  .roundBtn.off::after { content:''; position:absolute; left:9px; right:9px; top:50%; height:3px; background:#c62828; transform:rotate(-45deg); border-radius:2px; }
  #camBtn { display:block; position:fixed; left:254px; top:12px; z-index:7; width:42px; height:42px; border-radius:50%; border:none; cursor:pointer;
    background:rgba(255,255,255,.94); box-shadow:0 2px 8px rgba(0,0,0,.3); font-size:20px; }
  #toast { position:fixed; left:50%; top:16px; transform:translateX(-50%); background:rgba(20,20,20,.9); color:#fff; padding:10px 16px; border-radius:10px; z-index:15; font-weight:600; max-width:90vw; text-align:center; opacity:0; transition:opacity .25s; pointer-events:none; }
  #toast.show { opacity:1; }
  #hint { position:fixed; bottom:10px; left:50%; transform:translateX(-50%); color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.7); font-size:12px; z-index:4; pointer-events:none; }

  /* ===== Màn hình bắt đầu (chọn chế độ, quân cờ 3D, màu) ===== */
  #setup { position:fixed; inset:0; z-index:30; overflow:auto; color:#fff;
    background:radial-gradient(ellipse at 50% -10%, rgba(183,28,28,.92), rgba(40,10,10,.9) 45%, rgba(8,18,12,.94)); backdrop-filter:blur(5px); }
  .sWrap { max-width:1160px; margin:0 auto; padding:30px 20px 120px; }
  .sTitle { text-align:center; margin:0; font-size:52px; font-weight:900; letter-spacing:1px; line-height:1.1;
    background:linear-gradient(#fffbe6, #f9c74f 55%, #d8901a); -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 4px 0 rgba(0,0,0,.35)); }
  .sStar { display:block; text-align:center; font-size:34px; color:#f9c74f; filter:drop-shadow(0 0 12px rgba(249,199,79,.7)); }
  .sSub { text-align:center; opacity:.85; margin:8px auto 24px; max-width:660px; font-size:15px; line-height:1.5; }
  .sModes { display:flex; gap:14px; justify-content:center; margin-bottom:10px; flex-wrap:wrap; }
  .sMode { flex:1; max-width:360px; min-width:230px; background:rgba(255,255,255,.07); border:2px solid rgba(255,255,255,.16);
    border-radius:18px; padding:14px 18px; cursor:pointer; display:flex; gap:14px; align-items:center; transition:.2s; }
  .sMode:hover { background:rgba(255,255,255,.12); }
  .sMode input { display:none; }
  .sMode .ic { font-size:38px; }
  .sMode b { font-size:19px; display:block; }
  .sMode small { opacity:.75; font-size:13px; }
  .sMode:has(input:checked) { border-color:#f9c74f; background:rgba(249,199,79,.16); box-shadow:0 0 0 4px rgba(249,199,79,.14); }
  .sTeamNote { text-align:center; font-size:14px; opacity:.9; min-height:22px; margin:6px 0 16px; }
  .sGrid { display:grid; grid-template-columns:repeat(4, 1fr); gap:18px; }
  .sCard { --pc:#e53935; background:#fff; color:#1d1d1f; border-radius:20px; overflow:hidden; box-shadow:0 12px 34px rgba(0,0,0,.4);
    border-top:7px solid var(--pc); transition:opacity .25s, filter .25s, transform .25s; }
  .sCard:hover { transform:translateY(-3px); }
  .sCard.off { opacity:.45; filter:grayscale(.9); }
  .sHead { display:flex; align-items:center; gap:8px; padding:11px 14px 0; font-weight:800; font-size:14px; color:#555; }
  .sHead .grow { flex:1; }
  .stage { position:relative; margin:10px 12px 0; border-radius:16px; overflow:hidden;
    background:radial-gradient(circle at 50% 78%, color-mix(in srgb, var(--pc) 45%, #fff) 0%, color-mix(in srgb, var(--pc) 12%, #f6f6f6) 55%, #eef1f3 100%); }
  .stage canvas { width:100%; height:auto; display:block; }
  .arrow { position:absolute; top:44%; transform:translateY(-50%); width:38px; height:38px; border-radius:50%; border:none; cursor:pointer;
    background:rgba(255,255,255,.92); box-shadow:0 2px 8px rgba(0,0,0,.25); font-size:16px; font-weight:900; color:#333; transition:transform .15s; }
  .arrow:hover { transform:translateY(-50%) scale(1.12); }
  .arrow.l { left:8px; } .arrow.r { right:8px; }
  .shapeName { position:absolute; left:50%; bottom:8px; transform:translateX(-50%); white-space:nowrap; font-weight:800; font-size:14px;
    background:rgba(255,255,255,.92); padding:3px 12px; border-radius:999px; box-shadow:0 2px 6px rgba(0,0,0,.15); }
  .shapeDots { position:absolute; left:0; right:0; top:8px; display:flex; justify-content:center; gap:4px; }
  .shapeDots i { width:6px; height:6px; border-radius:50%; background:rgba(0,0,0,.18); }
  .shapeDots i.on { background:var(--pc); transform:scale(1.4); }
  .sBody { padding:12px 14px 16px; display:flex; flex-direction:column; gap:11px; }
  .sName { font-size:17px; font-weight:700; padding:9px 12px; border:2px solid #e3e3e3; border-radius:12px; font-family:inherit; width:100%; }
  .sName:focus { outline:none; border-color:var(--pc); }
  .seg { display:flex; background:#eceff1; border-radius:12px; padding:3px; }
  .seg button { flex:1; border:none; background:none; padding:8px; border-radius:10px; font-weight:700; cursor:pointer; font-family:inherit; font-size:14px; color:#666; }
  .seg button.on { background:#fff; color:#1d1d1f; box-shadow:0 1px 5px rgba(0,0,0,.2); }

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
"use strict";
// ================== DỮ LIỆU ==================
const GROUPS = {

};
const P = (name, group, price, rent) => ({ type:'property', name, group, price, rent });
const AIR = name => ({ type:'air', name, price:200 });
const UTIL = (name, icon) => ({ type:'util', name, price:150, icon });
const TILES = [
  { type:'go', name:'Xuất phát' },
  P('Mũi Cà Mau','brown',60,[2,10,30,90,160,250]),
  { type:'chest', name:'Khí vận' },
  P('Bạc Liêu','brown',60,[4,20,60,180,320,450]),
  { type:'tax', name:'Thuế thu nhập', amount:200 },
  AIR('Sân bay Nội Bài'),
  P('Cao Bằng','lightBlue',100,[6,30,90,270,400,550]),
  { type:'chance', name:'Cơ hội' },
  P('Hà Giang','lightBlue',100,[6,30,90,270,400,550]),
  P('Sa Pa','lightBlue',120,[8,40,100,300,450,600]),
  { type:'jail', name:'Nhà tù' },
  P('Phong Nha','pink',140,[10,50,150,450,625,750]),
  UTIL('Thủy điện Hòa Bình','⚡'),
  P('Cố đô Huế','pink',140,[10,50,150,450,625,750]),
  P('Phố cổ Hội An','pink',160,[12,60,180,500,700,900]),
  AIR('Sân bay Đà Nẵng'),
  P('Cần Thơ','orange',180,[14,70,200,550,750,950]),
  { type:'chest', name:'Khí vận' },
  P('Vũng Tàu','orange',180,[14,70,200,550,750,950]),
  P('Đà Lạt','orange',200,[16,80,220,600,800,1000]),
  { type:'parking', name:'Bãi đỗ xe' },
  P('Quy Nhơn','red',220,[18,90,250,700,875,1050]),
  { type:'chance', name:'Cơ hội' },
  P('Nha Trang','red',220,[18,90,250,700,875,1050]),
  P('Phú Quốc','red',240,[20,100,300,750,925,1100]),
  AIR('Sân bay Cam Ranh'),
  P('Tràng An','yellow',260,[22,110,330,800,975,1150]),
  P('Vịnh Hạ Long','yellow',260,[22,110,330,800,975,1150]),
  UTIL('Nhà máy nước','💧'),
  P('Đà Nẵng','yellow',280,[24,120,360,850,1025,1200]),
  { type:'gotojail', name:'Vào tù' },
  P('Hải Phòng','green',300,[26,130,390,900,1100,1275]),
  P('Bình Dương','green',300,[26,130,390,900,1100,1275]),
  { type:'chest', name:'Khí vận' },
  P('Đồng Nai','green',320,[28,150,450,1000,1200,1400]),
  AIR('Sân bay Tân Sơn Nhất'),
  { type:'chance', name:'Cơ hội' },
  P('Hà Nội','darkBlue',350,[35,175,500,1100,1300,1500]),
  { type:'tax', name:'Thuế xa xỉ', amount:100 },
  P('TP. Hồ Chí Minh','darkBlue',400,[50,200,600,1400,1700,2000]),
];
const GROUP_IDX = {};
TILES.forEach((t,i) => { if (t.group) (GROUP_IDX[t.group] = GROUP_IDX[t.group] || []).push(i); });
const BUYABLE = t => t.type==='property' || t.type==='air' || t.type==='util';
const PLAYER_COLORS = ['#e53935','#1e88e5','#43a047','#fbc02d','#8e24aa','#fb8c00','#ec407a','#00acc1','#6d4c41','#37474f'];
const TOKEN_SHAPES = [
  ['pawn', '♟️', 'Quân cờ'], ['car', '🚗', 'Xe hơi'], ['boat', '⛵', 'Thuyền buồm'], ['nonla', '👒', 'Nón lá'],
  ['star', '⭐', 'Ngôi sao'], ['gem', '💎', 'Kim cương'], ['crown', '👑', 'Vương miện'], ['drum', '🥁', 'Trống đồng'],
];
const shapeIcon = s => (TOKEN_SHAPES.find(t => t[0] === s) || TOKEN_SHAPES[0])[1];
const START_MONEY = 1500, GO_SALARY = 200, JAIL_FINE = 50;

// ================== TIỆN ÍCH ==================
const fmt = n => '$' + Math.round(n).toLocaleString('en-US');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const $ = id => document.getElementById(id);
const FONT = '"Segoe UI", Roboto, Arial, sans-serif';

// ================== THREE.JS ==================
const container = $('scene');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfeeff);
scene.fog = new THREE.Fog(0xcfeeff, 60, 150);
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 500);
// Camera lùi vừa đủ để thấy trọn bàn cờ theo tỉ lệ màn hình (điện thoại dọc cần lùi xa hơn)
const CAM_DIR = new THREE.Vector3(0, 0.9, 0.44).normalize();
function camDist() {
  const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)), a = innerWidth / innerHeight;
  return Math.min(58, Math.max(7.05 / (t * a), 8.5 / t));
}
function placeCamera() {
  if (innerWidth >= 760) { camera.position.set(0, 15, 14); return; }
  camera.position.copy(CAM_DIR.clone().multiplyScalar(camDist()));
}
placeCamera();
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0.5);
controls.enableDamping = true;
controls.maxPolarAngle = 1.35;
controls.minDistance = 6; controls.maxDistance = 60;

scene.add(new THREE.HemisphereLight(0xdff3ff, 0x5d7a3a, 0.75));
const sun = new THREE.DirectionalLight(0xfff1d6, 0.85);
sun.position.set(8, 16, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left:-10, right:10, top:10, bottom:-10, near:1, far:40 });
scene.add(sun);

const base = new THREE.Mesh(new THREE.BoxGeometry(13.8,0.6,13.8), new THREE.MeshStandardMaterial({ color:0x6d4c2f, roughness:.8 }));
base.position.y = -0.3; base.receiveShadow = true; base.castShadow = true; scene.add(base);

function canvasTex(cv) { const t = new THREE.CanvasTexture(cv); t.anisotropy = renderer.capabilities.getMaxAnisotropy(); return t; }
function wrapLines(ctx, text, maxW) {
  const words = text.split(' '), lines = []; let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}
function drawLines(ctx, lines, x, y, lh) { lines.forEach((l,k) => ctx.fillText(l, x, y + k*lh)); }

// --- Ô bàn cờ: vị trí ---
function tileGeom(i) {
  if (i % 10 === 0) {
    const c = { 0:[5.5,5.5], 10:[-5.5,5.5], 20:[-5.5,-5.5], 30:[5.5,-5.5] }[i];
    return { x:c[0], z:c[1], angle:0, w:2, d:2, corner:true };
  }
  const s = Math.floor(i/10), k = i % 10;
  if (s === 0) return { x:5-k,  z:5.5,  angle:0,           w:1, d:2 };
  if (s === 1) return { x:-5.5, z:5-k,  angle:-Math.PI/2,  w:1, d:2 };
  if (s === 2) return { x:-5+k, z:-5.5, angle:Math.PI,     w:1, d:2 };
  return               { x:5.5,  z:-5+k, angle:Math.PI/2,   w:1, d:2 };
}

function tileTexture(t) {
  const corner = ['go','jail','parking','gotojail'].includes(t.type);
  const W = corner ? 400 : 200, H = 400;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#f6f1e1'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 5; ctx.strokeRect(2,2,W-4,H-4);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#1d1d1f';
  const title = (txt, y, size) => { ctx.font = `800 ${size}px ${FONT}`; drawLines(ctx, wrapLines(ctx, txt.toUpperCase(), W-24), W/2, y, size*1.15); };
  const price = p => { ctx.font = `700 34px ${FONT}`; ctx.fillText(fmt(p), W/2, H-40); };
  const icon = (e, y, size) => { ctx.font = `${size}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif`; ctx.fillText(e, W/2, y); };
  switch (t.type) {
    case 'property':
      ctx.fillStyle = GROUPS[t.group].c; ctx.fillRect(4,4,W-8,84);
      ctx.strokeRect(2,2,W-4,88);
      ctx.fillStyle = '#1d1d1f'; title(t.name, 150, 30); price(t.price); break;
    case 'air': title(t.name, 55, 24); icon('✈️', 215, 90); price(t.price); break;
    case 'util': title(t.name, 60, 26); icon(t.icon, 215, 90); price(t.price); break;

  new THREE.Vector3(10,0,22), new THREE.Vector3(23,0,15), new THREE.Vector3(30,0,0), new THREE.Vector3(27,0,-17), new THREE.Vector3(12,0,-31),

function noise(x, z) { return Math.sin(x*0.15)*Math.cos(z*0.13)*1.2 + Math.sin(x*0.37 + z*0.21)*0.6 + Math.cos(z*0.45 - x*0.12)*0.4; }

SND.cash = null; SND.cashFrom = 0;
function loadCashSound() {
  const ctx = SND.ctx; if (!ctx || SND.cashLoading) return; SND.cashLoading = true;
  try {
    const bin = atob(CASH_MP3.split(',')[1]), buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    ctx.decodeAudioData(buf.buffer, ab => {
      const d = ab.getChannelData(0); let i = 0;
      let peak = 0; for (let k = 0; k < d.length; k++) peak = Math.max(peak, Math.abs(d[k]));
      while (i < d.length && Math.abs(d[i]) < Math.max(0.01, peak * 0.08)) i++;   // bỏ khoảng lặng đầu
      SND.cashFrom = Math.max(0, i / ab.sampleRate - 0.005);
      SND.cashVol = Math.min(8, 0.75 / Math.max(peak, 0.01));                    // file thu nhỏ → khuếch đại cho ngang các tiếng khác
      SND.cash = ab;
    }, () => {});
  } catch (e) {}
}
function sfxCash() {
  const ctx = SND.ctx; if (!ctx || !SND.sfx) return;
  const now = performance.now(); if (now - lastCash < 400) return; lastCash = now;
  const t = ctx.currentTime + 0.01;
  if (SND.cash) {
    const s = ctx.createBufferSource(), g = ctx.createGain(), len = Math.min(2.5, SND.cash.duration - SND.cashFrom);
    s.buffer = SND.cash; s.connect(g); g.connect(SND.sfxGain);
    const v = SND.cashVol || 1;
    g.gain.setValueAtTime(v, t); g.gain.setValueAtTime(v, t + Math.max(0, len - 0.15)); g.gain.linearRampToValueAtTime(0, t + len);
    s.start(t, SND.cashFrom, len);
    return;
  }
  bell(1318.5, t, 0.3, 0.55); bell(1975.5, t + 0.15, 0.32, 1.0);
}
// --- Trừ tiền: đồng xu rơi leng keng (mất càng nhiều, rơi càng nhiều xu) ---
function coinClink(t, vol) {
  const ctx = SND.ctx, base = 2300 + Math.random() * 1600;
  [1, 2.76, 5.4].forEach((r, k) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'sine'; o.frequency.value = base * r;
    o.connect(g); env(g, t, vol / (k + 1.2), 0.001, 0.12 + 0.18 / (k + 1)); g.connect(SND.sfxGain); o.start(t); o.stop(t + 0.4); });
  noiseHit(t, 'highpass', 5000, 1, vol * 0.5, 0.01, SND.sfxGain);
}
// Trừ tiền (kiểu 7 người chơi chọn): "tèn tèn tẹt" 8-bit đi xuống như máy chơi game cổ mất xu
function sfxCoins() {
  const ctx = SND.ctx; if (!ctx || !SND.sfx) return;
  const now = performance.now(); if (now - lastCoin < 400) return; lastCoin = now;
  const t = ctx.currentTime + 0.02;
  const sq = (f0, f1, at, dur, vol) => {
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'square';
    o.frequency.setValueAtTime(f0, at); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, at + dur);
    o.connect(g); env(g, at, vol, 0.005, dur); g.connect(SND.sfxGain); o.start(at); o.stop(at + dur + 0.05);
  };
  [988, 784, 659, 523, 392].forEach((f, k) => sq(f, f, t + k * 0.075, 0.07, 0.09));
  sq(330, 220, t + 0.4, 0.25, 0.09);
}
function setMusic(on) {
  SND.music = on; try { localStorage.setItem('ctp-music', on ? '1' : '0'); } catch (e) {}
  if (SND.ctx) SND.musicGain.gain.setTargetAtTime(on ? 0.32 : 0, SND.ctx.currentTime, 0.3);
  const b = $('musicBtn'); if (b) { b.classList.toggle('off', !on); b.title = on ? 'Tắt nhạc' : 'Bật nhạc'; }
}
function setSfx(on) {
  SND.sfx = on; try { localStorage.setItem('ctp-sfx', on ? '1' : '0'); } catch (e) {}
  if (SND.ctx) SND.sfxGain.gain.value = on ? 0.9 : 0;
  const b = $('sfxBtn'); if (b) { b.classList.toggle('off', !on); b.textContent = on ? '🔊' : '🔇'; b.title = on ? 'Tắt tiếng xúc xắc' : 'Bật tiếng xúc xắc'; }

    const sendRoster = () => { if (asHost) sendAll({ t: 'peers', list: [...roster] }); };
    const peer = new Peer(asHost ? hostId : undefined, { debug: 0 });
    const errCode = e => ({ 'unavailable-id': 'code_taken', 'peer-unavailable': 'not_found', network: 'network', 'server-error': 'server', 'browser-incompatible': 'browser' })[e && e.type] || (e && e.type) || 'error';
    await new Promise((res, rej) => {
      const t = setTimeout(() => rej({ code: 'timeout' }), 12000);

      peer.on('error', e => { clearTimeout(t); rej({ code: errCode(e) }); });
    });
    roster.set(myId, Object.freeze({}));
    peer.on('disconnected', () => { try { peer.reconnect(); } catch (e) {} }); // giữ mã phòng để người khác còn vào được
    if (asHost) {
      peer.on('connection', conn => {
        conn.on('open', () => { conns.set(conn.peer, conn); roster.set(conn.peer, Object.freeze({})); sendRoster(); fire(); });
        conn.on('data', msg => {
          if (!msg || typeof msg !== 'object') return;
          if (msg.t === 'emit' && typeof msg.topic === 'string') { deliver(msg.topic, msg.data, conn.peer); sendAll({ t: 'emit', topic: msg.topic, data: msg.data, from: conn.peer }, conn.peer); }

        });

        peer.on('error', e => { clearTimeout(t); rej({ code: errCode(e) }); });
      }).catch(e => { try { peer.destroy(); } catch (er) {} throw e; });
      conns.set('host', conn);
      conn.on('data', msg => {

        if (msg.t === 'emit' && typeof msg.topic === 'string') deliver(msg.topic, msg.data, msg.from);
        else if (msg.t === 'peers' && Array.isArray(msg.list)) {
          const mine = roster.get(myId);

        }
      });

    }
    setTimeout(fire, 0);
    return {
      name,
      emit(topic, data) {
        const d = JSON.parse(JSON.stringify(data === undefined ? null : data));
        setTimeout(() => deliver(topic, d, myId), 0);
        if (asHost) sendAll({ t: 'emit', topic, data: d, from: myId });
        else { const c = conns.get('host'); if (c && c.open) c.send({ t: 'emit', topic, data: d }); }
        return Promise.resolve();
      },
      on(topic, fn) { (handlers[topic] = handlers[topic] || []).push(fn); return () => { handlers[topic] = handlers[topic].filter(f => f !== fn); }; },
      presence(patch) {
        const p = Object.assign({}, roster.get(myId));

      },
      peers: () => snap,
      onPeers(fn) { peerFns.push(fn); setTimeout(() => fn({ peers: snap, joined: snap, left: [], updated: [] }), 0); return () => {}; },
      connected: () => true,
      leave() { try { peer.destroy(); } catch (e) {} return Promise.resolve(); },
    };
  } };

// Lượt của người chơi: chờ từng lựa chọn cho tới khi kết thúc lượt
async function humanTurn(p) {
  for (;;) {
    const m = await getInput(p, TURN_KINDS);
    if (m.k === 'botify') {
      if (state.phase === 'roll') await botTurn(); else { await botManage(p); await sleep(400); nextTurn(); }
      return;
    }
    const i = m.v;
    switch (m.k) {
      case 'roll': if (state.phase === 'roll') { await rollAction(); if (p.bankrupt) { nextTurn(); return; } } break;
      case 'end': if (state.phase === 'end') { nextTurn(); return; } break;
      case 'payjail': if (p.inJail && state.phase === 'roll' && p.money >= JAIL_FINE) { p.money -= JAIL_FINE; p.inJail = false; p.jailTurns = 0; log(`${pn(p)} trả ${fmt(JAIL_FINE)} để ra tù`); } break;
      case 'usecard': if (p.inJail && state.phase === 'roll' && p.jailCards) { p.jailCards--; p.inJail = false; p.jailTurns = 0; log(`${pn(p)} dùng thẻ ra tù miễn phí`); } break;
      case 'build': if (canBuild(p, i)) build(p, i); break;
      case 'sell': if (canSell(p, i)) sellHouse(p, i); break;
      case 'mort': if (canMortgage(p, i)) mortgage(p, i); break;
      case 'unmort': if (canUnmortgage(p, i)) unmortgage(p, i); break;
      case 'selljail': sellJailCard(p); break;
      case 'give': if ([50, 100, 200].includes(i)) giveMoney(p, teammate(p), i); break;
      case 'buildhere': {
        const bt = state.buildTile;
        if (bt != null && canBuild(p, bt)) { build(p, bt); state.buildTile = null; }
        break;
      }
    }
    refreshUI();
  }
}

}

const moveTo = (p, target) => moveSteps(p, (target - p.pos + 40) % 40);

// ---------- Xe cảnh sát áp giải vào tù ----------
function makePoliceCar() {
  const g = new THREE.Group(), M = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: .45, ...o });
  const add = (geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; g.add(m); return m; };
  add(new THREE.BoxGeometry(0.72, 0.14, 0.34), M(0xfafafa), 0, 0.13, 0);                         // thân xe trắng
  add(new THREE.BoxGeometry(0.73, 0.05, 0.345), M(0x1a237e), 0, 0.1, 0);                          // sọc xanh đậm
  add(new THREE.BoxGeometry(0.36, 0.12, 0.3), M(0xfafafa), -0.04, 0.26, 0);                       // khoang lái
  add(new THREE.BoxGeometry(0.37, 0.08, 0.305), M(0x263238, { metalness: .6, roughness: .15 }), -0.04, 0.26, 0); // kính
  add(new THREE.BoxGeometry(0.02, 0.05, 0.26), M(0xfff59d, { emissive: 0xfff59d, emissiveIntensity: .8 }), 0.365, 0.15, 0); // đèn pha
  const red = M(0xff1744, { emissive: 0xff1744, emissiveIntensity: 1 }), blue = M(0x2979ff, { emissive: 0x2979ff, emissiveIntensity: 1 });
  add(new THREE.BoxGeometry(0.1, 0.03, 0.28), M(0x37474f), 0.02, 0.33, 0);                        // giá đèn
  add(new THREE.BoxGeometry(0.09, 0.06, 0.12), red, 0.02, 0.37, -0.07);
  add(new THREE.BoxGeometry(0.09, 0.06, 0.12), blue, 0.02, 0.37, 0.07);
  const wheel = new THREE.CylinderGeometry(0.065, 0.065, 0.06, 14), wm = M(0x212121);
  [[0.22, 0.17], [-0.22, 0.17], [0.22, -0.17], [-0.22, -0.17]].forEach(([x, z]) => { const w = add(wheel, wm, x, 0.065, z); w.rotation.x = Math.PI / 2; });
  // quầng sáng đỏ/xanh dưới gầm (vòng mờ trên mặt bàn, không dùng đèn thật để khỏi giật hình)
  const halo = new THREE.Mesh(new THREE.CircleGeometry(0.55, 24), new THREE.MeshBasicMaterial({ color: 0xff1744, transparent: true, opacity: .35, depthWrite: false }));
  halo.rotation.x = -Math.PI / 2; halo.position.y = -0.17; g.add(halo);
  g.userData = { red, blue, halo };
  g.scale.setScalar(1.35);
  return g;
}
// chỗ quân cờ ngồi: thùng sau của xe (không che đèn trên nóc)
const _seat = new THREE.Vector3(), _Y = new THREE.Vector3(0, 1, 0);
const carSeat = car => _seat.set(-0.27 * 1.35, 0.21 * 1.35, 0).applyAxisAngle(_Y, car.rotation.y).add(car.position);
function flashPolice(car) {
  const u = car.userData, on = Math.floor(performance.now() / 110) % 2 === 0;
  u.red.emissiveIntensity = on ? 1.6 : 0.1; u.blue.emissiveIntensity = on ? 0.1 : 1.6;
  u.halo.material.color.setHex(on ? 0xff1744 : 0x2979ff);
}
// Chạy xe theo các điểm pts trong ms mili-giây; rider (nếu có) ngồi trên nóc xe
function driveAlong(car, pts, ms, rider) {
  const seg = [], total = pts.slice(1).reduce((s, q, k) => { const l = q.distanceTo(pts[k]); seg.push(l); return s + l; }, 0) || 1;
  return tween(ms, t => {
    let s = t * total, k = 0;
    while (k < seg.length - 1 && s > seg[k]) { s -= seg[k]; k++; }
    const a = pts[k], b = pts[k + 1] || a, f = seg[k] ? Math.min(1, s / seg[k]) : 1;
    car.position.lerpVectors(a, b, f);
    if (b !== a) {
      const want = Math.atan2(-(b.z - a.z), b.x - a.x);
      let d = want - car.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d));
      car.rotation.y += d * 0.35;
    }
    car.position.y = 0.2 + Math.abs(Math.sin(t * 40)) * 0.015; // rung nhẹ khi chạy nhanh
    flashPolice(car);
    if (rider) rider.mesh.position.copy(carSeat(car));
  });
}
async function policeRide(p, from) {
  sfxSiren();
  const car = makePoliceCar(); scene.add(car);
  // đường đi: theo các ô từ chỗ bị bắt về ô Nhà tù, chọn chiều ngắn hơn
  const fwd = (10 - from + 40) % 40, dir = fwd <= 20 ? 1 : -1, n = Math.min(fwd, 40 - fwd);
  const path = [];
  for (let k = 0; k <= n; k++) { const g = tileGeom((from + dir * k + 40) % 40); path.push(new THREE.Vector3(g.x, 0.2, g.z)); }
  // xe lao tới từ ngoài bàn cờ
  const g0 = tileGeom(from), start = new THREE.Vector3(g0.x, 0.2, g0.z);
  start.add(new THREE.Vector3(g0.x, 0, g0.z).setLength(6)); start.y = 0.2;
  car.position.copy(start); car.rotation.y = Math.atan2(-(path[0].z - start.z), path[0].x - start.x);
  await driveAlong(car, [start, path[0]], 380);
  // quân cờ nhảy lên nóc xe
  const a = p.mesh.position.clone(), roof = carSeat(car).clone();
  await tween(200, t => { p.mesh.position.lerpVectors(a, roof, t); p.mesh.position.y += Math.sin(Math.PI * t) * 0.6; flashPolice(car); });
  sfxStep();
  if (path.length > 1) await driveAlong(car, path, Math.min(1150, 180 + n * 55), p);
  // thả quân cờ vào tù
  const b = tokenTarget(p.idx, 10), a2 = p.mesh.position.clone();
  await tween(240, t => { p.mesh.position.lerpVectors(a2, b, t); p.mesh.position.y += Math.sin(Math.PI * t) * 0.7; flashPolice(car); });
  sfxStep(true);
  // xe phóng đi rồi biến mất (không chờ)
  const gj = tileGeom(10), away = new THREE.Vector3(gj.x, 0, gj.z).setLength(14); away.y = 0.2;
  driveAlong(car, [car.position.clone(), away], 650).then(() => {
    scene.remove(car); car.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
  });
}
async function pay(p, amt, cred) {
  if (amt <= 0 || p.bankrupt) return;
  if (p.money < amt) {
    if (p.isBot) raiseFunds(p, amt);
    else if (!(await humanRaiseFunds(p, amt, cred))) { await bankrupt(p, cred); refreshUI(); return; }
    if (p.isBot) raiseFunds(p, amt); // vừa được giao cho máy chơi thay
  }
  if (p.money >= amt) { p.money -= amt; moneyFx(p, -amt); if (cred) { cred.money += amt; moneyFx(cred, amt); } }
  else await bankrupt(p, cred);
  refreshUI();
}
const gain = (p, amt) => { p.money += amt; moneyFx(p, amt); refreshUI(); };
function raiseFunds(p, need) {
  if (p.money < need) log(`${pn(p)} thiếu tiền, phải bán/thế chấp tài sản…`);
  while (p.money < need) {
    let i = ownedBy(p).find(j => canSell(p, j)); if (i !== undefined) { sellHouse(p, i); continue; }
    i = ownedBy(p).find(j => canMortgage(p, j)); if (i !== undefined) { mortgage(p, i); continue; }
    break;
  }
}
// Người chơi thiếu tiền: tự chọn bán nhà / thế chấp / bán thẻ ra tù, hoặc tuyên bố phá sản
async function humanRaiseFunds(p, amt, cred) {
  let confirmBankrupt = false;
  const box = $('modalBox');
  for (;;) {
    if (isLocal(p)) { $('modal').classList.add('show'); render(); }
    const m = await getInput(p, ['rf']);
    if (m.k === 'botify') { $('modal').classList.remove('show'); return true; }
    const d = m.v && m.v.d, i = m.v && m.v.i;
    if (d === 'sell' && canSell(p, i)) sellHouse(p, i);
    else if (d === 'mort' && canMortgage(p, i)) mortgage(p, i);
    else if (d === 'selljail') sellJailCard(p);
    else if (d === 'askmate') { const mt = teammate(p); if (mt) giveMoney(mt, p, Math.min(Math.max(0, amt - p.money), mt.money)); }
    else if (d === 'pay' && p.money >= amt) { $('modal').classList.remove('show'); return true; }
    else if (d === 'bankrupt') { $('modal').classList.remove('show'); return false; }
    confirmBankrupt = false;
    refreshUI();
  }
  function render() {
    {
      const rows = ownedBy(p).map(i => {
        const t = TILES[i], o = state.own[i], b = [];
        if (canSell(p, i)) b.push(`<button class="btn sm alt" data-d="sell" data-i="${i}">Bán 1 ${o.houses === 5 ? 'KS' : 'nhà'} +${fmt(GROUPS[t.group].h / 2)}</button>`);
        if (canMortgage(p, i)) b.push(`<button class="btn sm alt" data-d="mort" data-i="${i}">Thế chấp +${fmt(mortVal(i))}</button>`);
        if (!b.length) return '';
        const chip = t.group ? GROUPS[t.group].c : '#455a64';
        const st = o.houses === 5 ? '🏨' : o.houses ? '🏠×' + o.houses : '';
        return `<div class="prow"><span class="nm"><span class="chip" style="background:${chip}"></span>${esc(t.name)} ${st}</span>${b.join('')}</div>`;
      }).join('') + (p.jailCards ? `<div class="prow"><span class="nm">🎫 Thẻ ra tù ×${p.jailCards}</span><button class="btn sm alt" data-d="selljail">Bán +${fmt(JAIL_CARD_PRICE)}</button></div>` : '');
      const short = Math.max(0, amt - p.money), enough = short === 0;
      const mate = teammate(p), help = mate ? Math.min(short, mate.money) : 0;
      const mateRow = mate && help > 0 ? `<div class="prow"><span class="nm">🤝 Nhờ đồng đội ${pn(mate)} (có ${fmt(mate.money)})</span><button class="btn sm ok" data-d="askmate">Nhận ${fmt(help)}</button></div>` : '';
      box.innerHTML = `<h2>⚠️ Không đủ tiền!</h2>
        <p>${pn(p)} phải trả <b>${fmt(amt)}</b> ${cred ? 'cho ' + pn(cred) : 'cho ngân hàng'}.<br>Đang có <b>${fmt(p.money)}</b>${enough ? ' — <b style="color:#2e7d32">đã đủ!</b>' : ` — còn thiếu <b style="color:#c62828">${fmt(short)}</b>`}</p>
        <p class="muted">Hãy tự chọn bán nhà hoặc thế chấp tài sản để có đủ tiền.</p>
        <div style="max-height:40vh;overflow:auto">${mateRow}${rows || '<i class="muted">Không còn tài sản nào để bán hoặc thế chấp.</i>'}</div>
        <div class="mbtns">
          <button class="btn alt" data-d="bankrupt" ${enough ? 'disabled' : ''}>${confirmBankrupt ? 'Bấm lần nữa để xác nhận' : '💥 Tuyên bố phá sản'}</button>
          <button class="btn ok" data-d="pay" ${enough ? '' : 'disabled'}>Trả ${fmt(amt)}</button>
        </div>`;
      box.querySelectorAll('[data-d]').forEach(el => el.onclick = () => {
        const d = el.dataset.d;
        if (d === 'bankrupt' && !confirmBankrupt) { confirmBankrupt = true; render(); return; }
        box.querySelectorAll('[data-d]').forEach(b => b.disabled = true);
        sendInput(p, 'rf', el.dataset.i !== undefined ? { d, i: +el.dataset.i } : { d });
      });
    }
  }
}
const JAIL_CARD_PRICE = 50;
function sellJailCard(p) {
  if (!p.jailCards) return;
  p.jailCards--; p.money += JAIL_CARD_PRICE; moneyFx(p, JAIL_CARD_PRICE);
  log(`${pn(p)} bán thẻ ra tù cho ngân hàng (+${fmt(JAIL_CARD_PRICE)})`);
}

async function bankrupt(p, cred) {
  log(`💥 ${pn(p)} đã PHÁ SẢN!`, 'sep');
  toast(`💥 ${esc(p.name)} phá sản!`, 2500);
  p.bankrupt = true;
  if (cred) cred.money += p.money;
  p.money = 0;
  for (const i of ownedBy(p)) {
    const o = state.own[i];
    if (cred) o.owner = cred; else { o.owner = null; o.mortgaged = false; o.houses = 0; }
    refreshTile(i);
  }
  if (cred) log(`Toàn bộ tài sản chuyển cho ${pn(cred)}`);
  await tween(500, t => p.mesh.scale.setScalar(1 - t));
  p.mesh.visible = false;
}
function repairs(p, perHouse, perHotel) {
  let h = 0, k = 0;
  ownedBy(p).forEach(i => { const n = state.own[i].houses; if (n === 5) k++; else h += n; });
  return h * perHouse + k * perHotel;
}

const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng()*(i+1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const decks = { chance: shuffle(cardsChance()), chest: shuffle(cardsChest()) };

async function drawCard(p, type) {
  const deck = decks[type], card = deck.shift(); deck.push(card);
  const isChance = type === 'chance';
  await liftCard3D(type);
  await revealCard(p, type, card.text);
  log(`${pn(p)} rút thẻ ${isChance ? 'Cơ hội' : 'Khí vận'}: <i>${esc(card.text)}</i>`);
  await card.act(p);
}

// Lá bài 3D bay lên từ chồng thẻ giữa bàn về phía camera
function liftCard3D(type) {
  const src = piles[type]; if (!src) return Promise.resolve();
  const m = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.03, 1.17), src.material);
  m.position.copy(src.position); m.position.y = 0.2; m.rotation.y = src.rotation.y; scene.add(m);
  const start = m.position.clone(), end = camera.position.clone().lerp(controls.target, 0.55);
  return tween(650, t => {
    const e = t * t;
    m.position.lerpVectors(start, end, e); m.position.y += Math.sin(t * Math.PI) * 1.5;
    m.rotation.x = -t * 1.3; m.rotation.z = t * 0.6;
  }).then(() => { scene.remove(m); m.geometry.dispose(); });
}

// Lá bài úp giữa màn hình: người chơi bấm để bóc (máy tự bóc)
async function revealCard(p, type, text) {
  if (p.isBot) return revealCardView(p, type, text, true);
  // người chơi: bấm để bóc → gửi 'flip'; bấm OK → gửi 'ok'. Máy khác chỉ xem.
  const v = revealCardView(p, type, text, false);
  let m = await getInput(p, ['flip']);
  v.flip(m.k === 'botify');
  if (m.k === 'botify') return v.done;
  m = await getInput(p, ['ok']);
  v.close();
  return v.done;
}
function revealCardView(p, type, text, auto) {
  let api;
  const done = new Promise(res => {
    const ov = $('cardOverlay'), isChance = type === 'chance', mine = isLocal(p);
    ov.innerHTML = `<div class="cwho">${pn(p)} rút thẻ ${isChance ? 'Cơ hội' : 'Khí vận'}</div>
      <div class="flip-wrap idle"><div class="flipcard">
        <div class="face back ${type}"><div class="bicon">${isChance ? '❓' : '🎁'}</div><div class="btitle">${isChance ? 'CƠ HỘI' : 'KHÍ VẬN'}</div></div>
        <div class="face front ${type}"><div class="fhead">${isChance ? '❓ CƠ HỘI' : '🎁 KHÍ VẬN'}</div><div class="ftext">${esc(text)}</div></div>
      </div></div>
      <div class="chint">${auto ? '&nbsp;' : mine ? '👆 Bấm vào thẻ để bóc' : `⏳ Chờ ${esc(p.name)} bóc thẻ…`}</div>
      <button class="btn ok cok">OK</button>`;
    ov.classList.add('show');
    const wrap = ov.querySelector('.flip-wrap'), card = ov.querySelector('.flipcard'), ok = ov.querySelector('.cok'), hint = ov.querySelector('.chint');
    let flipped = false, closed = false;
    const close = () => { if (closed) return; closed = true; ov.classList.remove('show'); ov.innerHTML = ''; res(); };
    const flip = autoClose => {
      if (flipped) return; flipped = true;
      if (autoClose) auto = true;
      wrap.classList.remove('idle'); card.classList.add('flipped'); hint.style.visibility = 'hidden';
      setTimeout(() => {
        for (let k = 0; k < 14; k++) {
          const s = document.createElement('span'); s.className = 'spark'; s.textContent = k % 3 ? '✨' : (isChance ? '⭐' : '💰');
          const a = Math.random() * Math.PI * 2, d = 150 + Math.random() * 120;
          s.style.setProperty('--dx', Math.cos(a) * d + 'px'); s.style.setProperty('--dy', Math.sin(a) * d + 'px');
          ov.appendChild(s); setTimeout(() => s.remove(), 950);
        }
      }, 380);
      setTimeout(() => { if (auto) setTimeout(close, 1500); else if (mine) ok.classList.add('show'); else hint.textContent = `⏳ Chờ ${p.name} bấm OK…`, hint.style.visibility = ''; }, 750);
    };
    if (auto) setTimeout(() => flip(), 700);
    else if (mine) {
      wrap.onclick = () => { if (!flipped) { wrap.onclick = null; sendInput(p, 'flip'); } };
      ok.onclick = () => { ok.onclick = null; ok.disabled = true; sendInput(p, 'ok'); };
    }
    api = { flip, close };
  });
  return { done, flip: a => api.flip(a), close: () => api.close() };
}

async function askBuy(p, i) {
  const t = TILES[i];
  return ask(p, 'buy', `<h2>Mua ${esc(t.name)}?</h2><p class="muted">Bạn có ${fmt(p.money)}</p>${deedHTML(i)}`,
    [{ label:'Bỏ qua', value:false, cls:'alt' }, { label:'Mua ' + fmt(t.price), value:true, cls:'ok' }],
    async () => { await sleep(400); return p.money - t.price >= 120; });
}

async function land(p) {
  if (p.bankrupt) return;
  const i = p.pos, t = TILES[i], o = state.own[i];
  ringPulse(i, p.color);
  refreshUI();
  if (o) {
    if (!o.owner) {
      if (p.money >= t.price) {
        if (await askBuy(p, i)) { p.money -= t.price; o.owner = p; refreshTile(i); moneyFx(p, -t.price); coinBurst(i); popIn(tileObjs[i].marker); log(`${pn(p)} mua <b>${esc(t.name)}</b> giá ${fmt(t.price)}`); }
        else log(`${pn(p)} không mua ${esc(t.name)}`);
      } else log(`${pn(p)} không đủ tiền mua ${esc(t.name)}`);
    } else if (o.owner === p) {
      if (t.type === 'property' && o.houses >= 5) log(`${esc(t.name)} đã có khách sạn, không thể xây thêm`);
      else if (t.type === 'property' && !o.mortgaged) {
        state.buildTile = i; // giữ quyền xây ở ô này đến hết lượt
        if (canBuild(p, i)) await offerBuild(p, i);
        else if (!p.isBot) log(`${pn(p)} chưa đủ ${fmt(GROUPS[t.group].h)} để xây ở ${esc(t.name)}. Có thể bán/thế chấp tài sản khác rồi bấm "🏠 Xây" trong lượt này.`);
      }
    } else {
      if (sameTeam(p, o.owner)) { log(`🤝 ${esc(t.name)} là đất của đồng đội ${pn(o.owner)} — miễn tiền thuê`); toast(`🤝 Đất của đồng đội — miễn tiền thuê`); }
      else if (o.mortgaged) log(`${esc(t.name)} đang thế chấp, không thu tiền thuê`);
      else {
        let diceSum = state.lastDice;
        if (t.type === 'util') {
          const mult = countType(o.owner, 'util') === 2 ? 10 : 4;
          toast(`🎲 ${esc(p.name)} tung xúc xắc để tính tiền ${esc(t.name)} (${mult} × số nút)`, 2200);
          await sleep(700);
          const [a, b] = await rollDice(); diceSum = a + b;
          log(`${pn(p)} tung xúc xắc tính tiền ${esc(t.name)}: ${a} + ${b} = ${diceSum} → ${mult} × ${diceSum} = <b>${fmt(mult * diceSum)}</b>`);
          await sleep(500);
        }
        const r = calcRent(i, diceSum);
        log(`${pn(p)} trả ${fmt(r)} tiền thuê ${esc(t.name)} cho ${pn(o.owner)}`);
        if (isLocal(p)) toast(`Bạn trả ${fmt(r)} tiền thuê cho ${esc(o.owner.name)}`);
        else toast(`${esc(p.name)} trả ${fmt(r)} cho ${esc(o.owner.name)}`);
        await pay(p, r, o.owner);
      }
    }
  } else if (t.type === 'tax') { log(`${pn(p)} nộp ${esc(t.name)} ${fmt(t.amount)}`); await pay(p, t.amount, null); }
  else if (t.type === 'chance' || t.type === 'chest') await drawCard(p, t.type);
  else if (t.type === 'gotojail') await goJail(p);
  refreshUI();
}

async function rollAction() {
  const p = cur();
  state.busy = true; state.buildTile = null; refreshUI();
  const [a, b] = await rollDice(); const sum = a + b, dbl = a === b;
  state.lastDice = sum;
  log(`${pn(p)} tung được ${a} + ${b} = <b>${sum}</b>${dbl ? ' (đôi!)' : ''}`);
  let again = false;
  if (p.inJail) {
    if (dbl) { p.inJail = false; p.jailTurns = 0; log(`${pn(p)} ra tù nhờ tung được đôi`); await moveSteps(p, sum); await land(p); }
    else {
      p.jailTurns++;
      if (p.jailTurns >= 3) {
        log(`${pn(p)} đã ở đủ 3 lượt trong tù, được ra tù miễn phí`);
        p.inJail = false; p.jailTurns = 0; await moveSteps(p, sum); await land(p);
      } else log(`${pn(p)} vẫn ở trong tù (${p.jailTurns}/3)`);
    }
  } else {
    if (dbl) state.doubles++;
    if (state.doubles >= 3) { log(`${pn(p)} tung đôi 3 lần liên tiếp!`); await goJail(p); }
    else { await moveSteps(p, sum); await land(p); again = dbl && !p.inJail && !p.bankrupt; }
  }
  state.busy = false;
  state.phase = again ? 'roll' : 'end';
  refreshUI();
}

async function botTurn() {
  const p = cur();
  while (true) {
    await sleep(650);
    if (p.inJail) {
      if (p.jailCards) { p.jailCards--; p.inJail = false; p.jailTurns = 0; log(`${pn(p)} dùng thẻ ra tù miễn phí`); }
      else if (p.money >= 400) { p.money -= JAIL_FINE; p.inJail = false; p.jailTurns = 0; log(`${pn(p)} trả ${fmt(JAIL_FINE)} để ra tù`); }
      refreshUI();
    }
    await rollAction();
    if (p.bankrupt || state.phase !== 'roll') break;
  }
  if (!p.bankrupt) await botManage(p);
  await sleep(500);
  nextTurn();
}
async function botManage(p) {
  for (const i of ownedBy(p)) if (state.own[i].mortgaged && p.money - unmortCost(i) > 500) unmortgage(p, i);
  // 2 vs 2: máy giúp đồng đội đang cạn tiền
  const mate = teammate(p);
  if (mate && mate.money < 150 && p.money > 600) giveMoney(p, mate, 200);
  refreshUI();
}

function checkWin() {
  const alive = state.players.filter(p => !p.bankrupt);
  if (state.mode === 'team') {
    const teams = new Set(alive.map(p => p.team));
    if (teams.size > 1) return false;
    state.phase = 'over'; refreshUI(); confetti();
    const t = alive[0].team, members = state.players.filter(p => p.team === t);
    log(`🏆 ${teamBadge(t)} (${members.map(pn).join(' &amp; ')}) CHIẾN THẮNG!`, 'sep');
    showModal(`<h2>🏆 ${teamBadge(t)} chiến thắng!</h2><p style="font-size:18px">${members.map(pn).join(' &amp; ')} đã khiến đội bạn phá sản.</p>
      <p>Tiền mặt còn lại của đội: <b>${fmt(alive.reduce((s, p) => s + p.money, 0))}</b> · ${alive.reduce((s, p) => s + ownedBy(p).length, 0)} tài sản</p>`,
      [{ label:'Chơi lại', value:true }]).then(() => location.reload());
    return true;
  }
  if (alive.length > 1) return false;
  state.phase = 'over'; refreshUI();
  const w = alive[0];
  confetti();
  log(`🏆 ${pn(w)} là TỈ PHÚ chiến thắng!`, 'sep');
  showModal(`<h2>🏆 Chiến thắng!</h2><p style="font-size:18px">${pn(w)} trở thành tỉ phú với <b>${fmt(w.money)}</b> tiền mặt và ${ownedBy(w).length} tài sản.</p>`,
    [{ label:'Chơi lại', value:true }]).then(() => location.reload());
  return true;
}
function nextTurn() {
  if (checkWin()) return;
  do state.cur = (state.cur + 1) % state.players.length; while (state.players[state.cur].bankrupt);
  startTurn();
}
async function startTurn() {
  const p = cur(); state.doubles = 0; state.phase = 'roll'; state.buildTile = null;
  log(`— Lượt của ${pn(p)} —`, 'sep');
  refreshUI();
  if (p.isBot) await botTurn(); else await humanTurn(p);
}

// ================== CHAT & CHỌC GHẸO ==================
// Không thuộc luật chơi nên đi kênh riêng ('ctp.chat'), không qua hàng đợi lockstep.
// Người chơi được nhận diện bằng p.idx (thứ tự lúc tạo, giống nhau trên mọi máy).
const TEASE = { brick: ['🧱', 'Gạch', 'ném gạch vào'], poop: ['💩', 'Phân', 'ném phân vào'], egg: ['🥚', 'Trứng', 'chọi trứng vào'], rose: ['🌹', 'Hoa', 'tặng hoa cho'] };
const QUICK_EMO = ['😂', '😎', '😡', '😭', '🥳', '👍', '🤡', '💸', '🙏', '❤️', '🔥', '😱'];
const CHAT = { open: false, unread: 0, target: null, cool: 0, bubbles: {} };
const byIdx = i => state.players.find(p => p.idx === i);
const mePlayer = () => { const c = cur(); return NET.online ? state.players.find(isLocal) : (isLocal(c) ? c : state.players.find(isLocal)); };
function chatSend(obj, byUser) {
  if (NET.online && NET.room) NET.room.emit('ctp.chat', obj).catch(() => {});
  else chatRecv(obj, 'local');
  // điện thoại: khung chat che bàn cờ → đóng lại để thấy đồ bay / bong bóng lời nói
  if (byUser && innerWidth < 760) chatToggle(false);
}
function chatRecv(d, peer) {
  if (!d || typeof d !== 'object' || !NET.started) return;
  let from = null;
  if (Number.isInteger(d.from) && d.from >= 0) {
    const q = byIdx(d.from); if (!q) return;
    const ok = !NET.online || (q.human && q.peer === peer) || (!q.human && peer === NET.hostPeer);
    if (!ok) return;
    from = q;
  } else if (NET.online && !state.players.some(q => q.human && q.peer === peer) && d.t === 'throw') return;
  const who = from ? pn(from) : '<b>👀 Khán giả</b>';
  if (d.t === 'say' && typeof d.text === 'string') {
    const text = d.text.replace(/[\u0000-\u001f]/g, '').trim().slice(0, 120); if (!text) return;
    chatLine(`${who}: ${esc(text)}`, from);
    if (from) bubble(from, text);
  } else if (d.t === 'emo' && QUICK_EMO.includes(d.e)) {
    chatLine(`${who}: <span class="bigEmo">${d.e}</span>`, from);
    if (from) bubble(from, d.e, true);
  } else if (d.t === 'throw' && TEASE[d.item] && Number.isInteger(d.to)) {
    const to = byIdx(d.to); if (!to || !from || to === from || to.bankrupt) return;
    const [ic, , verb] = TEASE[d.item];
    chatLine(`${ic} ${pn(from)} ${verb} ${pn(to)}!`, from, 'sys'); // chỉ ghi trong khung chat, không ghi vào nhật ký
    throwFx(from, to, d.item);
    // máy bị chọc thì phản ứng lại (chỉ một máy quyết định: chơi trên máy này, hoặc chủ phòng)
    if (!to.human && (!NET.online || NET.role === 'host') && Math.random() < 0.8) setTimeout(() => {
      if (to.bankrupt) return;
      if (d.item === 'rose') chatSend({ t: 'emo', from: to.idx, e: Math.random() < 0.5 ? '❤️' : '🥳' });
      else if (Math.random() < 0.45 && !from.bankrupt) chatSend({ t: 'throw', from: to.idx, to: from.idx, item: d.item });
      else chatSend({ t: 'emo', from: to.idx, e: ['😡', '😭', '😱', '🤡'][Math.floor(Math.random() * 4)] });
    }, 1300 + Math.random() * 900);
  }
}
function chatLine(html, from, cls) {
  const box = $('chatLog'), d = document.createElement('div');
  d.className = 'cmsg' + (cls ? ' ' + cls : '') + (from && isLocal(from) ? ' mine' : '');
  d.innerHTML = html; box.appendChild(d);
  while (box.children.length > 80) box.removeChild(box.firstChild);
  box.scrollTop = box.scrollHeight;
  if (!CHAT.open) { CHAT.unread++; const b = $('chatBadge'); b.textContent = CHAT.unread > 9 ? '9+' : CHAT.unread; b.style.display = ''; }
}
// Bong bóng lời nói nổi trên quân cờ
function bubble(p, text, big) {
  if (!p.mesh || !p.mesh.visible) return;
  const t = [...text].length > 22 ? [...text].slice(0, 21).join('') + '…' : text;
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 160;
  const c = cv.getContext('2d'); c.font = `700 ${big ? 92 : 50}px ${FONT}`;
  const w = Math.min(500, c.measureText(t).width + 56), x0 = (512 - w) / 2;
  c.fillStyle = '#fff'; c.strokeStyle = p.color; c.lineWidth = 8;
  c.beginPath(); c.roundRect ? c.roundRect(x0, 8, w, 112, 30) : c.rect(x0, 8, w, 112);
  c.moveTo(236, 118); c.lineTo(256, 152); c.lineTo(276, 118); c.fill(); c.stroke();
  c.fillStyle = '#fff'; c.fillRect(240, 112, 32, 8);
  c.fillStyle = '#1d1d1f'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(t, 256, 66);
  const mat = new THREE.SpriteMaterial({ map: canvasTex(cv), transparent: true, depthTest: false });
  const s = new THREE.Sprite(mat); s.scale.set(3.2, 1, 1); s.renderOrder = 12; scene.add(s);
  const old = CHAT.bubbles[p.idx]; if (old) old.kill();
  let alive = true;
  const kill = () => { if (!alive) return; alive = false; scene.remove(s); mat.map.dispose(); mat.dispose(); };
  CHAT.bubbles[p.idx] = { kill };
  const t0 = performance.now();
  const step = () => {
    if (!alive) return;
    const k = (performance.now() - t0) / 3200;
    s.position.copy(p.mesh.position); s.position.y += 1.25 + Math.min(1, k * 8) * 0.15;
    mat.opacity = k < .85 ? Math.min(1, k * 8) : Math.max(0, 1 - (k - .85) / .15);
    if (k >= 1) kill(); else requestAnimationFrame(step);
  };

  function publishLobby() {
    if (role !== 'host' || !NET.room) return;
    const lobby = { mode: modeVal(), seats: pick.map((s, k) => ({ t: s.type, on: on(k), n: s.name, sh: s.shape, c: s.color, pr: s.peer })) };
    const j = JSON.stringify(lobby); if (j === lastLobby) return; lastLobby = j;
    NET.room.presence({ role: 'host', lobby }).catch(() => {});
  }
  function guestPresence() {
    if (role !== 'guest' || !NET.room) return;
    NET.room.presence({ role: 'guest', name: myPrefs.name, shape: myPrefs.shape, color: myPrefs.color }).catch(() => {});
  }
  // Chủ phòng: xếp khách vào các ghế "Online" theo thứ tự vào phòng
  function assignSeats() {
    const guests = NET.room.peers().filter(p => !p.sameTab && p.kind === 'viewer' && p.presence && p.presence.role === 'guest');
    guestOrder = guestOrder.filter(id => guests.some(g => g.peer === id));
    guests.forEach(g => { if (!guestOrder.includes(g.peer)) guestOrder.push(g.peer); });
    pick.forEach(s => { if (s.type === 'online') s.peer = null; });
    let gi = 0;
    pick.forEach((s, k) => { if (s.type === 'online' && on(k) && gi < guestOrder.length) s.peer = guestOrder[gi++]; });
    pick.forEach((s, k) => {
      if (s.type !== 'online' || !s.peer) return;
      const g = guests.find(x => x.peer === s.peer).presence;
      s.name = cleanName(g.name) || 'Khách';
      if (TOKEN_SHAPES.some(t => t[0] === g.shape)) s.shape = g.shape;
      if (PLAYER_COLORS.includes(g.color) && !taken(k, g.color)) s.color = g.color;
      else if (taken(k, s.color)) s.color = freeColor(k);
    });
    const spect = guestOrder.length - gi;
    $('onInfo').innerHTML = roomInfo() + (spect > 0 ? `<div class="muted2">👀 ${spect} người đang xem (hết ghế Online)</div>` : '');
    syncAll();
  }
  // Khách: hiển thị bàn chờ theo chủ phòng
  function readLobby() {
    const host = NET.room.peers().find(p => !p.sameTab && p.presence && p.presence.role === 'host' && p.presence.lobby);
    if (!host) { if (!hostPeer) $('onInfo').innerHTML = roomInfo() + '<div class="muted2">🔎 Đang tìm chủ phòng…</div>'; return; }
    hostPeer = host.peer;
    const L = host.presence.lobby;
    if (!L || !Array.isArray(L.seats) || L.seats.length !== 4) return;
    const mr = document.querySelector(`input[name=mode][value=${L.mode === 'team' ? 'team' : 'ffa'}]`); if (mr) mr.checked = true;
    L.seats.forEach((x, k) => {
      const s = pick[k];
      s.type = ['me', 'online', 'bot'].includes(x.t) ? x.t : 'bot';
      $('on' + k).checked = !!x.on;
      s.peer = typeof x.pr === 'string' ? x.pr : null;
      if (s.peer === myPeer) return; // ghế của mình: giữ lựa chọn của mình cho mượt
      s.name = cleanName(x.n) || 'Người chơi';
      if (TOKEN_SHAPES.some(t => t[0] === x.sh)) s.shape = x.sh;
      if (PLAYER_COLORS.includes(x.c)) s.color = x.c;
    });
    const mine = pick.findIndex(s => s.peer === myPeer);
    if (mine >= 0) {
      const hostColor = L.seats[mine].c;
      if (myPrefs.color !== hostColor && PLAYER_COLORS.includes(hostColor)) myPrefs.color = hostColor; // chủ phòng đổi màu vì bị trùng
      Object.assign(pick[mine], { name: myPrefs.name, shape: myPrefs.shape, color: myPrefs.color });
    } else if (!myPrefs.color) {
      myPrefs.color = PLAYER_COLORS.find(c => !pick.some((q, j) => $('on' + j).checked && q.color === c)); guestPresence();
    }
    $('onInfo').innerHTML = roomInfo() + (mine >= 0 ? `<div class="muted2">✅ Bạn ngồi ghế <b>Người chơi ${mine + 1}</b>. Chọn tên, quân cờ và màu rồi chờ chủ phòng bắt đầu.</div>`
      : '<div class="muted2">👀 Phòng đã hết ghế Online — bạn sẽ được xem ván đấu.</div>');
    syncAll();
  }
  // Link mời chỉ dùng được khi game nằm trên một trang web thường (không phải claude.ai hay file trên máy)
  const inviteLink = () => NET.backend === 'peer' && /^https?:$/.test(location.protocol) ? `${location.origin}${location.pathname}?phong=${code}` : '';
  const roomInfo = () => `<div class="roomCode">Mã phòng: <b>${code}</b> <button type="button" class="sBtn sm" id="copyCode">📋 Chép mã</button>`
    + (role === 'host' && inviteLink() ? ` <button type="button" class="sBtn sm" id="copyLink">🔗 Chép link mời</button>` : '') + '</div>'
    + (role === 'host' ? `<div class="muted2">${inviteLink() ? 'Gửi link mời cho bạn bè — bấm vào là vào thẳng phòng. Hoặc' : 'Gửi mã này cho bạn bè:'} họ mở cùng link game, chọn <b>Chơi online</b> rồi nhập mã.</div>` : '');
  const copy = (txt, btn) => { const done = () => { btn.textContent = '✅ Đã chép'; };
    try { navigator.clipboard.writeText(txt).then(done, () => prompt('Chép:', txt)); } catch (er) { prompt('Chép:', txt); } };
  ov.addEventListener('click', e => {
    if (e.target.id === 'copyCode') copy(code, e.target);
    if (e.target.id === 'copyLink') copy(inviteLink(), e.target);
  });

  let startRes;
  const started = new Promise(r => startRes = r);
  async function enterRoom(asRole, c) {
    code = c; role = asRole;
    $('onInfo').innerHTML = '⏳ Đang kết nối…';
    try { NET.room = await roomApi.join('ctp-' + code.toLowerCase(), asRole === 'host'); }
    catch (e) {
      role = null;
      const c = e && e.code;
      const why = c === 'not_found' ? `Không tìm thấy phòng <b>${esc(code)}</b>. Kiểm tra lại mã, và chủ phòng phải đang mở game.`
        : c === 'code_taken' ? 'Mã phòng này đang được dùng. Bấm “Tạo phòng mới” lần nữa.'
        : c === 'script' || c === 'network' || c === 'server' || c === 'timeout' ? 'Không kết nối được máy chủ tìm phòng. Kiểm tra mạng rồi thử lại.'
        : c === 'browser' ? 'Trình duyệt này không hỗ trợ chơi online. Hãy dùng Chrome, Edge, Firefox hoặc Safari mới.'
        : `Không vào được phòng (${esc(c || 'lỗi')}).`;
      $('onInfo').innerHTML = `<span class="err">${why}</span>`; return;
    }
    document.querySelectorAll('input[name=where]').forEach(r => r.disabled = true);
    $('onStart').hidden = true;
    const room = NET.room;
    // tin nhắn trong ván (có thể tới trước khi ván bắt đầu trên máy này)
    room.on('ctp.in', msg => { if (!validInput(msg.data)) return; if (!NET.started) NET.preQ.push([msg.data, msg.peer]); else acceptInput(msg.data, msg.peer); });
    room.on('ctp.chat', msg => chatRecv(msg.data, msg.peer));
    room.on('ctp.need', msg => { const st = msg.data && msg.data.st; const m = Number.isInteger(st) && NET.sentLog[st]; if (m) room.emit('ctp.in', m).catch(() => {}); });
    room.on('ctp.start', msg => { if (role === 'guest' && msg.peer === hostPeer && !NET.started) { const cfg = validCfg(msg.data); if (cfg) startRes(cfg); } });
    room.onPeers(ch => {
      const me = ch.peers.find(p => p.sameTab); if (me && !myPeer) myPeer = me.peer;
      if (NET.started) {
        ch.left.forEach(lp => state.players.forEach(p => { if (p.human && p.peer === lp.peer && !p.gone) { p.gone = true; log(`⚠️ ${pn(p)} đã rời phòng`, 'sep'); } }));
        refreshUI(); return;
      }
      if (role === 'host') assignSeats(); else readLobby();
    });
    if (role === 'host') {
      pick.forEach((s, k) => { s.type = k === 0 ? 'me' : k === 1 ? 'online' : 'bot'; });
      $('onInfo').innerHTML = roomInfo();
    } else { myPrefs.name = cleanName(pick[0].name) === 'Bạn' ? 'Khách' : cleanName(pick[0].name) || 'Khách'; guestPresence(); $('onInfo').innerHTML = roomInfo() + '<div class="muted2">🔎 Đang tìm chủ phòng…</div>'; }
    syncAll();
  }
  function validCfg(d) {
    if (!d || !Number.isInteger(d.seed) || !Array.isArray(d.seats) || d.seats.length < 2 || d.seats.length > 4) return null;
    const ok = d.seats.every(s => s && typeof s.n === 'string' && PLAYER_COLORS.includes(s.c) && TOKEN_SHAPES.some(t => t[0] === s.sh)
      && typeof s.bot === 'boolean' && (s.pr === null || typeof s.pr === 'string') && Number.isInteger(s.k) && s.k >= 0 && s.k < 4);
    return ok ? { seed: d.seed, mode: d.mode === 'team' ? 'team' : 'ffa', seats: d.seats.map(s => ({ ...s, n: cleanName(s.n) || 'Người chơi' })) } : null;
  }

  // ---------- Sự kiện ----------
  ov.querySelectorAll('.sw').forEach(b => b.onclick = () => {
    const k = +b.dataset.p;
    if (!editable(k) || taken(k, b.dataset.c) || pick[k].color === b.dataset.c) return;
    pick[k].color = b.dataset.c;
    if (role === 'guest') { myPrefs.color = b.dataset.c; guestPresence(); }
    syncAll();
  });
  ov.querySelectorAll('.arrow').forEach(b => b.onclick = () => {
    const k = +b.dataset.k, n = TOKEN_SHAPES.length;
    if (!editable(k)) return;
    pick[k].shape = TOKEN_SHAPES[(shapeIdx(k) + +b.dataset.d + n) % n][0];
    if (role === 'guest') { myPrefs.shape = pick[k].shape; guestPresence(); }
    syncAll();
  });
  defs.forEach((_, k) => {
    $('tp' + k).onclick = e => {
      const b = e.target.closest('button[data-v]'); if (!b || role === 'guest') return;
      pick[k].type = b.dataset.v; if (b.dataset.v !== 'online') pick[k].peer = null;
      if (online()) { if (b.dataset.v === 'bot') pick[k].name = defs[k][0].startsWith('Máy') ? defs[k][0] : 'Máy ' + (k + 1); }
      if (role === 'host') assignSeats(); else syncAll();
    };
    $('on' + k).onchange = () => { if (role === 'host') assignSeats(); else syncAll(); };
    $('nm' + k).oninput = e => {
      if (!editable(k)) return;
      pick[k].name = cleanName(e.target.value);
      if (role === 'guest') { myPrefs.name = pick[k].name || 'Khách'; guestPresence(); } else publishLobby();
    };
  });
  ov.querySelectorAll('input[name=mode]').forEach(r => r.onchange = () => { if (role === 'host') assignSeats(); else syncAll(); });
  ov.querySelectorAll('input[name=where]').forEach(r => r.onchange = () => {
    where = document.querySelector('input[name=where]:checked').value;
    $('sOnline').hidden = !online();
    if (online()) pick.forEach((s, k) => { s.type = k === 0 ? 'me' : k === 1 ? 'online' : 'bot'; });
    else pick.forEach((s, k) => { s.type = localTypes[k]; s.peer = null; });
    syncAll();
  });
  $('mkRoom').onclick = () => {
    const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
    enterRoom('host', Array.from({ length: 4 }, () => A[Math.floor(Math.random() * A.length)]).join(''));
  };
  // Mã phòng: bỏ dấu tiếng Việt (bộ gõ Telex/VNI vẫn gõ được), chỉ giữ A–Z và 0–9
  const cleanCode = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[đĐ]/g, 'D').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4);
  let composing = false;
  const fixCode = () => { const el = $('codeIn'), v = cleanCode(el.value); if (el.value !== v) el.value = v; };
  $('codeIn').addEventListener('compositionstart', () => { composing = true; });
  $('codeIn').addEventListener('compositionend', () => { composing = false; fixCode(); });
  $('codeIn').oninput = e => { if (!composing && !e.isComposing) fixCode(); };
  $('codeIn').addEventListener('blur', fixCode);
  const joinIt = () => { fixCode(); const c = $('codeIn').value; if (c.length === 4) enterRoom('guest', c); else $('onInfo').innerHTML = '<span class="err">Mã phòng gồm 4 ký tự.</span>'; };
  $('joinBtn').onclick = joinIt;
  $('codeIn').onkeydown = e => { if (e.key === 'Enter') joinIt(); };

  // Phòng online: dùng phòng của claude.ai nếu có, không thì nối thẳng qua PeerJS (không cần tài khoản)
  let roomApi = null;
  const wo = $('whereOnline');
  wo.classList.add('disabledMode'); wo.querySelector('input').disabled = true;
  const inviteCode = (() => { try { return (new URLSearchParams(location.search).get('phong') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4); } catch (e) { return ''; } })();
  (window.claude && typeof window.claude.use === 'function' ? window.claude.use('room').catch(() => null) : Promise.resolve(null)).then(r => {
    roomApi = r || peerRoomApi();
    NET.backend = r ? 'claude' : 'peer';
    $('onlineSub').textContent = 'Mỗi người một máy, chơi chung một ván';
    wo.classList.remove('disabledMode'); wo.querySelector('input').disabled = false;
    // Mở bằng link mời (?phong=MÃ): vào thẳng phòng
    if (inviteCode.length === 4) {
      const w = document.querySelector('input[name=where][value=online]'); w.checked = true; w.dispatchEvent(new Event('change', { bubbles: true }));
      $('codeIn').value = inviteCode; enterRoom('guest', inviteCode);
    }
  });

  defs.forEach((_, k) => ensureTok(k));
  syncAll(); requestAnimationFrame(loop);

  // Bắt đầu: chủ phòng / chơi trên máy này bấm nút; khách chờ tin 'ctp.start'
  $('sStart').onclick = () => {
    if ($('sStart').disabled) return;
    const seats = pick.map((s, k) => ({ s, k })).filter(({ k }) => on(k)).map(({ s, k }) => ({
      n: cleanName(s.name) || ('Người chơi ' + (k + 1)), c: s.color, sh: s.shape, k,
      bot: s.type === 'bot',
      pr: s.type === 'bot' ? null : !online() ? 'local' : s.type === 'me' ? myPeer : s.peer,
    }));
    const cfg = { seed: Math.floor(Math.random() * 2147483647), mode: modeVal(), seats };
    if (online()) { const send = () => NET.room.emit('ctp.start', cfg).catch(() => {}); send(); setTimeout(send, 1200); setTimeout(send, 3000); }
    startRes(cfg);
  };
  const cfg = await started;
  alive = false;
  toks.forEach(disposeObj); pv.dispose();
  ov.style.transition = 'opacity .4s'; ov.style.opacity = '0';
  foot.remove();
  setTimeout(() => ov.remove(), 420);
  NET.online = online();
  NET.me = online() ? myPeer : 'local';
  NET.role = role;
  NET.hostPeer = role === 'host' ? myPeer : hostPeer; // chủ phòng nói thay các máy (bot) trong chat
  await beginGame(cfg);
}

async function beginGame(cfg) {
  state.mode = cfg.mode;
  rng = mulberry32(cfg.seed);
  decks.chance = shuffle(cardsChance()); decks.chest = shuffle(cardsChest());
  cfg.seats.forEach(s => {
    const idx = state.players.length;
    const p = { idx, name: s.n, color: s.c, shape: s.sh, isBot: s.bot, human: !s.bot, peer: s.bot ? null : s.pr,
      team: cfg.mode === 'team' ? (s.k % 2 === 0 ? 'A' : 'B') : null,
      money: START_MONEY, pos: 0, inJail: false, jailTurns: 0, jailCards: 0, bankrupt: false };
    p.mesh = makeToken(p.color, p.shape); p.mesh.position.copy(tokenTarget(idx, 0));
    state.players.push(p);
  });
  NET.started = true;
  NET.preQ.splice(0).forEach(([m, peer]) => acceptInput(m, peer));
  $('chatBtn').style.display = '';
  log('Chào mừng tới <b>Cờ Tỉ Phú Việt Nam</b>! 🇻🇳');
  if (NET.online) {
    const me = state.players.find(isLocal);
    log(me ? `🌐 Đang chơi online — bạn là ${pn(me)}` : '🌐 Đang xem ván đấu online');
  }
  if (state.mode === 'team') log(`Chế độ 2 vs 2: ${teamBadge('A')} ${state.players.filter(p => p.team === 'A').map(pn).join(' &amp; ')} — ${teamBadge('B')} ${state.players.filter(p => p.team === 'B').map(pn).join(' &amp; ')}`);
  await rollForOrder();
  state.cur = 0;
  startTurn();
}

// Tung xúc xắc chọn thứ tự đi: cao nhất đi trước, hoà thì những người hoà tung lại
async function rollForOrder() {
  state.phase = 'order';
  log('🎲 Mỗi người tung xúc xắc để chọn thứ tự đi', 'sep');
  const all = state.players.slice();
  all.forEach(p => p.orderRoll = []);
  const cmp = (a, b) => { for (let k = 0; k < Math.max(a.orderRoll.length, b.orderRoll.length); k++) { const d = (b.orderRoll[k] || 0) - (a.orderRoll[k] || 0); if (d) return d; } return 0; };
  let todo = all;
  while (todo.length) {
    for (const p of todo) {
      state.cur = state.players.indexOf(p); state.busy = false; refreshUI();
      if (p.isBot) await sleep(500);
      else await getInput(p, ['orderroll']);
      state.busy = true; refreshUI();
      const v = await rollDice(), s = v[0] + v[1];
      p.orderRoll.push(s);
      log(`${pn(p)} tung được ${v[0]} + ${v[1]} = <b>${s}</b>`);
      toast(`${pn(p)} tung được <b>${s}</b>`, 1100);
      renderPlayers(); await sleep(450);
    }
    // ai còn hoà với người khác (cùng mọi lần tung) thì tung lại
    todo = all.filter(p => all.some(q => q !== p && cmp(p, q) === 0));
    if (todo.length) log(`Hoà điểm: ${todo.map(pn).join(', ')} tung lại`);
  }
  let order = all.slice().sort(cmp);
  if (state.mode === 'team') {
    // giữ xen kẽ hai đội: đội có người tung cao nhất đi trước
    const first = order[0].team;
    const A = order.filter(p => p.team === first), B = order.filter(p => p.team !== first);
    order = []; A.forEach((p, k) => { order.push(p); if (B[k]) order.push(B[k]); });
  }
  state.players = order;
  log(`Thứ tự đi: ${order.map((p, k) => `${k + 1}. ${pn(p)}`).join(' → ')}`);
  toast(`${pn(order[0])} đi trước!`, 1600);
  await sleep(1300);
  all.forEach(p => delete p.orderRoll);
  state.busy = false;
}
animate();
setup();
</script>
